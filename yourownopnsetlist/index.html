<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>OPN SETLIST BUILDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            color: #000;
            font-family: 'Source Code Pro', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom); /* 아이폰 하단 바 대응 */
        }

        /* 셋리스트 종이 영역 */
        #setlist-paper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1.414; /* A4 비율 */
            background-color: #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            padding: 40px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }

        .header-info {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 30px;
            border-bottom: 1.5px solid #000;
            padding-bottom: 10px;
        }

        .setlist-body {
            flex-grow: 1;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #1a1a1a;
        }

        .warning-footer {
            font-size: 10px;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 하단 컨트롤러 (모바일 최적화) */
        .controls {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            background: #f5f5f5;
            position: sticky;
            bottom: 0;
        }

        textarea {
            width: 100%;
            height: 100px;
            /* 모바일에서 16px 미만이면 자동 줌인됨 */
            font-size: 16px;
            font-family: 'Source Code Pro', monospace;
            padding: 12px;
            border: 1.5px solid #000;
            border-radius: 0;
            box-sizing: border-box;
            outline: none;
            background: #fff;
            appearance: none;
        }

        button {
            width: 100%;
            margin-top: 10px;
            background: #000;
            color: #fff;
            border: none;
            padding: 15px;
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border-radius: 0;
        }

        button:active {
            background: #333;
        }

        p.guide {
            font-size: 11px;
            margin: 5px 0;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="setlist-paper">
        <div class="header-info">
            ONEOHTRIX POINT NEVER<br>
            TRANQUILIZER LIVE IN SEOUL<br>
            MAR 29TH 2026 @ 1975 THEATER
        </div>
        
        <div id="display-text" class="setlist-body">1. REPLICA
2. LONG ROAD HOME
3. STICKY DRAMA
4. I DON'T LOVE ME ANYMORE
5. BORING ANGEL</div>

        <div class="warning-footer">THIS IS NOT OFFICIAL</div>
    </div>

    <div class="controls">
        <p class="guide">TYPE YOUR SETLIST:</p>
        <textarea id="input-text" placeholder="한 줄에 한 곡씩 입력..."></textarea>
        <button onclick="saveSetlist()">SAVE SETLIST (PNG)</button>
    </div>

    <script>
        const textarea = document.getElementById('input-text');
        const display = document.getElementById('display-text');

        // 타이핑 시 실시간 반영
        textarea.addEventListener('input', (e) => {
            display.innerText = e.target.value;
        });

        function saveSetlist() {
            const paper = document.querySelector("#setlist-paper");
            
            // 버튼 클릭 시 시각적인 피드백을 위해 잠시 투명도 조절 (선택사항)
            html2canvas(paper, {
                backgroundColor: "#ffffff",
                scale: 3, // 고화질 출력
                logging: false,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'OPN-SETLIST-MS.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
