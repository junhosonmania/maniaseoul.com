<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANIA SEOUL x OPN Poster Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --point-color: #3dfc03; /* OPN 형광 그린 */
            --text-color: #ffffff;
        }

        body {
            background-color: #1a1a1a;
            color: var(--text-color);
            font-family: 'Source Code Pro', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }

        /* 포스터 영역 */
        #poster-area {
            width: 380px;
            height: 600px;
            background-color: var(--bg-color);
            border: 1px solid var(--point-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(61, 252, 3, 0.1);
        }

        .header {
            font-size: 12px;
            border-bottom: 1px solid var(--point-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: var(--point-color);
        }

        .main-title {
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .setlist-container {
            flex-grow: 1;
        }

        .setlist-item {
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
        }

        .footer {
            font-size: 10px;
            margin-top: auto;
            opacity: 0.7;
            text-align: right;
        }

        /* 입력 UI */
        .controls {
            margin-top: 40px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            font-family: 'Source Code Pro', monospace;
            padding: 15px;
            height: 150px;
            resize: none;
        }

        button {
            background: var(--point-color);
            color: #000;
            border: none;
            padding: 15px;
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="poster-area">
        <div class="header">MANIA SEOUL PRESENTS // ARCHIVE-01</div>
        <div class="main-title">ONEOHTRIX POINT NEVER<br>LIVE IN SEOUL</div>
        
        <div id="display-setlist" class="setlist-container">
            <span class="setlist-item">01. Replica</span>
            <span class="setlist-item">02. Long Road Home</span>
            <span class="setlist-item">03. Sticky Drama</span>
        </div>

        <div class="footer">
            2026 NEW YEAR GIFT / MANIASEOUL.COM
        </div>
    </div>

    <div class="controls">
        <label>TYPE YOUR IDEAL SETLIST (One per line):</label>
        <textarea id="input-setlist" placeholder="곡 제목을 한 줄씩 입력하세요..."></textarea>
        <button onclick="downloadPoster()">DOWNLOAD HD POSTER</button>
    </div>

    <script>
        const input = document.getElementById('input-setlist');
        const display = document.getElementById('display-setlist');

        input.addEventListener('input', (e) => {
            const lines = e.target.value.split('\n');
            display.innerHTML = lines
                .map((line, index) => line ? `<span class="setlist-item">${(index + 1).toString().padStart(2, '0')}. ${line}</span>` : '')
                .join('');
        });

        function downloadPoster() {
            html2canvas(document.querySelector("#poster-area"), {
                backgroundColor: "#0a0a0a",
                scale: 3 // 고화질 저장
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'MS-OPN-SETLIST.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
