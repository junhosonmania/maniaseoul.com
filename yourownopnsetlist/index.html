<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MY OWN OPN SETLIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #dcdcdc;
            color: #1a1a1a;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
        }

        /* 셋리스트 종이 스타일 */
        #setlist-paper {
            width: 90%;
            max-width: 380px;
            background-color: #fdfdfd;
            padding: 60px 40px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* 약간 구겨진 듯한 미세한 그라데이션 */
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 0%, rgba(245,245,245,1) 100%);
        }

        /* 상단 검정 테이프 디테일 */
        #setlist-paper::before {
            content: "";
            position: absolute;
            top: -15px;
            width: 100px;
            height: 40px;
            background: #111;
            transform: rotate(-1deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 50px;
            pointer-events: none;
        }

        .header-top {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            opacity: 0.6;
        }

        .artist-name {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 본문 입력 영역 */
        #editable-content {
            width: 100%;
            flex-grow: 1;
            font-size: 16px;
            line-height: 1.8;
            outline: none;
            min-height: 300px;
            white-space: pre-wrap;
            text-align: center; /* Slowdive 셋리스트처럼 중앙 정렬 */
            caret-color: #000;
            color: #222;
        }

        #editable-content:empty:before {
            content: 'TYPE YOUR SETLIST...';
            color: #ddd;
        }

        .footer {
            margin-top: 50px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            opacity: 0.5;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* 하단 버튼 제어 */
        .btn-container {
            width: 90%;
            max-width: 380px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button, a {
            width: 100%;
            border: 1px solid #1a1a1a;
            padding: 16px;
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            background: #fff;
            color: #000;
            letter-spacing: 1px;
        }

        #save-btn { background: #000; color: #fff; }
        #spotify-btn { color: #1DB954; border-color: #1DB954; }

    </style>
</head>
<body>

    <div id="setlist-paper">
        <div class="header">
            <div class="header-top">
                29.03.2026 / 1975 THEATER, SEOUL
            </div>
            <div class="artist-name">
                ONEOHTRIX POINT NEVER<br>
                TRANQUILIZER LIVE
            </div>
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false">1. Replica
2. Long Road Home
3. Sticky Drama
4. I Don't Love Me Anymore
5. Boring Angel</div>

        <div class="footer">
            THANK YOU MANIA SEOUL
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">SAVE IMAGE</button>
        <a id="spotify-btn" href="https://open.spotify.com" target="_blank">
            LISTEN ON SPOTIFY
        </a>
    </div>

    <script>
        const editable = document.getElementById('editable-content');
        const saveBtn = document.getElementById('save-btn');

        // 커서를 마지막으로 보내기
        window.onload = () => {
            editable.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(editable);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        };

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            const canvas = await html2canvas(paper, { 
                scale: 3, 
                backgroundColor: "#dcdcdc", // 배경색 유지
                logging: false 
            });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "OPN-SETLIST-MS.png", { type: "image/png" });
                
                if (navigator.share) {
                    try {
                        await navigator.share({ 
                            files: [file], 
                            title: 'OPN SETLIST' 
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') downloadFallback(canvas);
                    }
                } else {
                    downloadFallback(canvas);
                }
            }, 'image/png');
        };

        function downloadFallback(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'OPN-SETLIST-MS.png';
            link.click();
        }
    </script>
</body>
</html>
