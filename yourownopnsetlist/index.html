<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>OPN SETLIST BUILDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000;
            font-family: 'Source Code Pro', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* 실제 셋리스트 종이 */
        #setlist-paper {
            width: 90%;
            max-width: 380px;
            background-color: #fff;
            padding: 40px 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .header {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 25px;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            pointer-events: none; /* 헤더는 편집 불가 */
        }

        /* 바로 타이핑하는 영역 */
        #editable-content {
            flex-grow: 1;
            font-size: 17px;
            line-height: 1.6;
            outline: none;
            min-height: 300px;
            white-space: pre-wrap;
        }

        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px dashed #000;
            font-size: 11px;
            text-align: center;
            pointer-events: none;
        }

        /* 하단 버튼 */
        .btn-container {
            width: 90%;
            max-width: 380px;
            margin-top: 20px;
        }

        #save-btn {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 18px;
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .guide-text {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <p class="guide-text">종이 위를 터치해서 셋리스트를 적어보세요</p>

    <div id="setlist-paper">
        <div class="header">
            ONEOHTRIX POINT NEVER<br>
            TRANQUILIZER LIVE IN SEOUL<br>
            MAR 29TH 2026 @ 1975 THEATER
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false">
1. FOR RESIDUE
2. FEAR OF SYMMERTRY
3. VESTIGEL
4. 
        </div>

        <div class="footer">
            THANK YOU MANIA SEOUL!<br>
            <span style="opacity: 0.5; font-size: 9px;">THIS IS NOT OFFICIAL</span>
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">SAVE TO PHOTOS</button>
    </div>

    <script>
        const saveBtn = document.getElementById('save-btn');

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            
            // 1. 셋리스트를 이미지(Canvas)로 변환
            const canvas = await html2canvas(paper, {
                scale: 3,
                backgroundColor: "#ffffff"
            });

            // 2. Blob 데이터로 변환
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "OPN-SETLIST.png", { type: "image/png" });
                
                // 3. Web Share API를 이용해 공유창 띄우기 (아이폰/안드로이드 사진첩 저장 유도)
                if (navigator.share) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'OPN Setlist',
                            text: 'Created by Mania Seoul'
                        });
                    } catch (err) {
                        console.error("공유 실패:", err);
                        // 실패 시 일반 다운로드로 대체
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL();
                        link.download = 'OPN-SETLIST.png';
                        link.click();
                    }
                } else {
                    // PC 브라우저 등 Share API 미지원 시 바로 다운로드
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL();
                    link.download = 'OPN-SETLIST.png';
                    link.click();
                }
            }, 'image/png');
        };
    </script>
</body>
</html>
