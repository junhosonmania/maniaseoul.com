<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>OPN SETLIST BUILDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000;
            font-family: 'Source Code Pro', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        #setlist-paper {
            width: 92%;
            max-width: 380px;
            background-color: #fff;
            padding: 35px 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .header {
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 25px;
            pointer-events: none;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .artist-name {
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            margin: 8px 0;
            display: block;
        }

        .tour-title {
            font-size: 12px;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 2px 6px;
        }

        /* 텍스트 편집 영역 */
        #editable-content {
            flex-grow: 1;
            font-size: 17px;
            line-height: 1.5;
            outline: none;
            min-height: 320px;
            white-space: pre-wrap;
            caret-color: #000;
        }

        /* 회색 가이드 문구(Placeholder) 설정 */
        #editable-content:empty:before {
            content: '여기에 입력하세요...';
            color: #ccc;
            cursor: text;
        }

        .footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
        }

        .btn-container {
            width: 92%;
            max-width: 380px;
            margin-top: 15px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button, a {
            width: 100%;
            border: none;
            padding: 18px;
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        #save-btn { background: #000; color: #fff; }
        #spotify-btn { background: #1DB954; color: #000; }
    </style>
</head>
<body>

    <div id="setlist-paper">
        <div class="header">
            <div class="header-top">
                <span>DATE: MAR 29 2026</span>
                <span>VENUE: 1975 THEATER</span>
            </div>
            <span class="artist-name">ONEOHTRIX POINT NEVER</span>
            <span class="tour-title">TRANQUILIZER LIVE IN SEOUL</span>
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false"></div>

        <div class="footer">
            저 3월 29일만 기다려요 진짜
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">SAVE TO PHOTOS</button>
        <a id="spotify-btn" href="https://open.spotify.com/search" target="_blank">
            LISTEN ON SPOTIFY
        </a>
    </div>

    <script>
        const editable = document.getElementById('editable-content');
        const saveBtn = document.getElementById('save-btn');

        // 페이지 로드 시 커서 활성화
        window.onload = () => {
            editable.focus();
        };

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            const canvas = await html2canvas(paper, { scale: 3, backgroundColor: "#ffffff" });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "OPN-SETLIST-MS.png", { type: "image/png" });
                
                if (navigator.share) {
                    try {
                        await navigator.share({ files: [file], title: 'OPN SETLIST' });
                    } catch (err) {
                        if (err.name !== 'AbortError') downloadFallback(canvas);
                    }
                } else {
                    downloadFallback(canvas);
                }
            }, 'image/png');
        };

        function downloadFallback(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'OPN-SETLIST-MS.png';
            link.click();
        }
    </script>
</body>
</html>
