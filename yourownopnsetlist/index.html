<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPN SETLIST BUILDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Source Code Pro', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            margin: 0;
        }

        /* 셋리스트 본체 */
        #poster-area {
            width: 400px;
            height: 560px;
            background-color: #000000;
            padding: 50px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .info-header {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: 700;
            color: #3dfc03; /* OPN 포인트 컬러 */
        }

        .setlist-content {
            flex-grow: 1;
            font-size: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            text-transform: uppercase;
        }

        .warning-footer {
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-top: 20px;
        }

        /* 컨트롤 영역 */
        .controls {
            margin-top: 30px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Source Code Pro', monospace;
            padding: 15px;
            height: 120px;
            outline: none;
        }

        button {
            background: #3dfc03;
            color: #000;
            border: none;
            padding: 12px;
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="poster-area">
        <div class="info-header">
            ONEOHTRIX POINT NEVER<br>
            MAR 29TH 2026 @ 1975 THEATER
        </div>
        
        <div id="display-setlist" class="setlist-content">1. REPLICA
2. LONG ROAD HOME
3. STICKY DRAMA</div>

        <div class="warning-footer">THIS IS NOT OFFICIAL</div>
    </div>

    <div class="controls">
        <textarea id="input-setlist" placeholder="TYPE YOUR SETLIST HERE..."></textarea>
        <button onclick="downloadPoster()">SAVE IMAGE</button>
    </div>

    <script>
        const input = document.getElementById('input-setlist');
        const display = document.getElementById('display-setlist');

        input.addEventListener('input', (e) => {
            display.innerText = e.target.value;
        });

        function downloadPoster() {
            html2canvas(document.querySelector("#poster-area"), {
                backgroundColor: "#000000",
                scale: 3
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'OPN-SETLIST-MS.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
