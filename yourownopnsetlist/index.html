<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MY OWN OPN SETLIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #e8e8e8;
            color: #1a1a1a;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
        }

        #setlist-paper {
            width: 92%;
            max-width: 380px;
            background-color: #fff;
            padding: 40px 30px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #setlist-paper::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0) 95%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
        }

        .header {
            border-bottom: 1.5px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 30px;
            pointer-events: none;
            /* 헤더 내부 요소들 중앙 정렬을 위해 추가 */
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            width: 100%; /* 양 끝 정렬 유지 */
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .artist-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0; /* 마진 제거 */
            display: block;
            letter-spacing: -0.5px;
            text-align: center; /* 가운데 정렬 */
            word-break: keep-all; /* 단어 단위 줄바꿈으로 깔끔하게 */
        }

        #editable-content {
            flex-grow: 1;
            font-size: 18px;
            line-height: 1.4;
            outline: none;
            min-height: 340px;
            white-space: pre-wrap;
            caret-color: #ff0000;
        }

        #editable-content:empty:before {
            content: 'TYPE SETLIST HERE...';
            color: #ddd;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-transform: uppercase;
        }

        .btn-container {
            width: 92%;
            max-width: 380px;
            margin-top: 20px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button, a {
            width: 100%;
            border: 1.5px solid #1a1a1a;
            padding: 18px;
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        #save-btn { background: #1a1a1a; color: #fff; }
        #spotify-btn { background: #fff; color: #1DB954; border-color: #1DB954; }
    </style>
</head>
<body>

    <div id="setlist-paper">
        <div class="header">
            <div class="header-top">
                <span>DATE: 29.03.2026</span>
                <span>1975 THEATER, SEOUL</span>
            </div>
            <span class="artist-name">ONEOHTRIX POINT NEVER<br>TRANQUILIZER LIVE IN SEOUL</span>
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false"></div>

        <div class="footer">
            저 3월 29일만 기다려요 진짜
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">SAVE TO PHOTOS</button>
        <a id="spotify-btn" href="https://open.spotify.com/search" target="_blank">
            LISTEN ON SPOTIFY
        </a>
    </div>

    <script>
        const editable = document.getElementById('editable-content');
        const saveBtn = document.getElementById('save-btn');

        window.onload = () => {
            editable.focus();
        };

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            const canvas = await html2canvas(paper, { 
                scale: 3, 
                backgroundColor: "#ffffff",
                logging: false 
            });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "OPN-SETLIST-MS.png", { type: "image/png" });
                
                if (navigator.share) {
                    try {
                        await navigator.share({ 
                            files: [file], 
                            title: 'OPN SETLIST by Mania Seoul' 
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') downloadFallback(canvas);
                    }
                } else {
                    downloadFallback(canvas);
                }
            }, 'image/png');
        };

        function downloadFallback(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'OPN-SETLIST-MS.png';
            link.click();
        }
    </script>
</body>
</html>
