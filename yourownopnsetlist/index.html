<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MY OWN OPN SETLIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000;
            font-family: 'Source Code Pro', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px; /* 상단 마진 최소화 */
        }

        #setlist-paper {
            width: 92%;
            max-width: 380px;
            background-color: #fff;
            padding: 35px 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        /* 헤더 디자인 강화 (Hierarchy) */
        .header {
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 25px;
            pointer-events: none;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .artist-name {
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            margin: 8px 0;
            display: block;
        }

        .tour-title {
            font-size: 12px;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 2px 6px;
            margin-top: 4px;
        }

        /* 셋리스트 편집 영역 */
        #editable-content {
            flex-grow: 1;
            font-size: 17px;
            line-height: 1.5;
            outline: none;
            min-height: 320px;
            white-space: pre-wrap;
            /* 첫 줄 마진 제거 */
            margin-top: 0; 
        }

        .footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .btn-container {
            width: 92%;
            max-width: 380px;
            margin-top: 15px;
            margin-bottom: 40px;
        }

        #save-btn {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 18px;
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .guide-text {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <p class="guide-text">TAP TO EDIT YOUR SETLIST</p>

    <div id="setlist-paper">
        <div class="header">
            <div class="header-top">
                <span>DATE: MAR 29 2026</span>
                <span>VENUE: 1975 THEATER</span>
            </div>
            <span class="artist-name">ONEOHTRIX POINT NEVER</span>
            <span class="tour-title">TRANQUILIZER LIVE IN SEOUL</span>
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false">
1. FOR RESIDUE
2. FEAR OF SYMMETRY
3. VESTIGEL
4. TRANQUILIZER
5. BUMPY
6. </div>

        <div class="footer">
            THANK YOU MANIA SEOUL!
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">SAVE TO PHOTOS</button>
    </div>

    <script>
        const saveBtn = document.getElementById('save-btn');

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            const canvas = await html2canvas(paper, {
                scale: 3,
                backgroundColor: "#ffffff"
            });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "OPN-SETLIST-MS.png", { type: "image/png" });
                
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'OPN SETLIST',
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') downloadFallback(canvas);
                    }
                } else {
                    downloadFallback(canvas);
                }
            }, 'image/png');
        };

        function downloadFallback(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'OPN-SETLIST-MS.png';
            link.click();
        }
    </script>
</body>
</html>
