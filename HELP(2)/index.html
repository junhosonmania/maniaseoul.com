<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HELP(2) Listening Party | Beggars Group</title>
    <style>
        @font-face {
            font-family: 'TAYBirdie';
            src: url('TAYBirdie.otf') format('opentype');
        }

        :root {
            --key-color: #e6007d;
            --bg-color: #ffffff;
            --system-border: 1.5px solid #000;
        }

        body {
            font-family: 'TAYBirdie', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 상단 고정 바: 이지적인 시스템 느낌 */
        header {
            position: fixed; top: 0; width: 100%;
            background: var(--bg-color);
            border-bottom: var(--system-border);
            padding: 10px 15px;
            display: flex; justify-content: space-between;
            z-index: 1000;
            font-size: 0.85rem;
        }

        .label-name { font-weight: bold; color: var(--key-color); }

        main { padding-top: 50px; }

        section {
            padding: 40px 20px;
            border-bottom: var(--system-border);
        }

        /* 영상: 가장 자연스러운 mp4 자동재생 */
        .video-box {
            width: 100%; height: 300px;
            background: #eee;
            margin: 20px 0;
            border: var(--system-border);
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* 스튜디오 리캡 이미지 & 캡션 */
        .recap-grid { display: flex; flex-direction: column; gap: 30px; }
        .recap-item img { width: 100%; border: 1px solid #000; }
        .caption { font-size: 0.75rem; margin-top: 5px; color: #666; }

        /* 트랙리스트: 클릭 시 가사 표시 (인터랙션) */
        .track-row {
            display: flex; justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px dotted var(--key-color);
            cursor: pointer;
        }
        .track-row:hover { color: var(--key-color); }

        /* 인스타그래머블 포인트: 랜덤 텍스트 오버레이 */
        #interactive-zone {
            height: 200px;
            background: #f0f0f0;
            display: flex; align-items: center; justify-content: center;
            border: 2px dashed var(--key-color);
            position: relative; overflow: hidden;
            font-size: 1.2rem; font-weight: bold;
        }

        .label-copy { font-size: 1.1rem; line-height: 1.6; word-break: break-all; }
        .special-note { font-style: italic; background: #000; color: #fff; padding: 20px; }
    </style>
</head>
<body>

<header>
    <div class="label-name">BEGGARS GROUP</div>
    <div>HELP(2) LISTENING SESSION</div>
</header>

<main>
    <section>
        <h1 style="font-size: 3rem; margin-bottom: 10px;">HELP(2)</h1>
        <div class="video-box">
            <video autoplay loop muted playsinline>
                <source src="recap-video.mp4" type="video/mp4">
            </video>
        </div>
        <p class="label-copy">레이블 카피가 이곳에 위치합니다. 짧고 명료한 문장들로 앨범의 정체성을 설명하세요.</p>
    </section>

    <section>
        <h2 style="color: var(--key-color);">TRACKLIST</h2>
        <div class="track-row" onclick="showLyrics('01')">
            <span>01. Track Title</span>
            <span>LYRICS ↗</span>
        </div>
        </section>

    <section>
        <h2 style="margin-bottom: 20px;">STUDIO RECAP</h2>
        <div class="recap-grid">
            <div class="recap-item">
                <img src="recap1.jpg" alt="recap">
                <div class="caption">[FIG 1.] Recording session in London, 2025.</div>
            </div>
        </div>
    </section>

    <section id="interactive-zone" onclick="addSticker(event)">
        TAP TO GENERATE HELP(2)
        </section>

    <section class="special-note">
        <p>“이 앨범은 어떤 마음으로 만들어졌습니다...” - Special Note Context</p>
    </section>
</main>

<script>
    // 인스타그래머블 인터랙션: 클릭 시 랜덤 위치에 텍스트 생성
    const zone = document.getElementById('interactive-zone');
    const messages = ['HELP(2)', 'BEGGARS', 'E6007D', 'RECAP', '2026'];
    
    function addSticker(e) {
        const span = document.createElement('span');
        span.innerText = messages[Math.floor(Math.random() * messages.length)];
        span.style.position = 'absolute';
        span.style.left = e.offsetX + 'px';
        span.style.top = e.offsetY + 'px';
        span.style.color = '#e6007d';
        span.style.fontSize = (Math.random() * 2 + 1) + 'rem';
        span.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
        zone.appendChild(span);
    }

    function showLyrics(trackId) {
        alert('가사 데이터가 준비되면 해당 트랙(' + trackId + ')의 내용을 보여줍니다.');
    }
</script>

</body>
</html>
