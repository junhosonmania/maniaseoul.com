<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MY OWN SHAME SETLIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #c0c0c0;
            color: #111;
            font-family: 'Rock Salt', cursive;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
        }

        #setlist-paper {
            width: 90%;
            max-width: 380px;
            background-color: #fff;
            padding: 60px 30px 40px;
            box-sizing: border-box;
            box-shadow: 2px 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            /* 종이 질감 추가 */
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
        }

        /* 스테이플러 심 (금속 느낌 강조) */
        .staple {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 35px;
            height: 5px;
            background: #777;
            border-bottom: 1px solid #444;
            z-index: 10;
        }

        /* 종이 접힌 효과 */
        #setlist-paper::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 40px 40px 0;
            border-color: transparent transparent #e0e0e0 transparent;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.1);
        }

        .header {
            width: 100%;
            text-align: left;
            margin-bottom: 40px;
            pointer-events: none;
        }

        .header-top {
            font-size: 11px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .artist-name {
            font-size: 44px;
            line-height: 1;
            margin: 15px 0;
            display: block;
            transform: rotate(-2deg); /* 아티스트명 살짝 틀기 */
        }

        #editable-content {
            width: 100%;
            flex-grow: 1;
            font-size: 20px;
            line-height: 1.6;
            outline: none;
            min-height: 300px;
            white-space: pre-wrap;
            text-align: left;
            caret-color: #000;
            color: #111;
        }

        #editable-content:empty:before {
            content: 'Write tracks here...';
            color: #ccc;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            text-align: right;
            opacity: 0.7;
            pointer-events: none;
        }

        .btn-container {
            width: 90%;
            max-width: 380px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button, a {
            width: 100%;
            border: 3px solid #111;
            padding: 16px;
            font-family: sans-serif; 
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            background: #fff;
            color: #111;
            text-transform: uppercase;
        }

        #save-btn { background: #111; color: #fff; }
        #spotify-btn { color: #1DB954; border-color: #1DB954; }
    </style>
</head>
<body>

    <div id="setlist-paper">
        <div class="staple"></div>
        
        <div class="header">
            <div class="header-top">
                26.04.2026 / SSMD LIVE HALL
            </div>
            <span class="artist-name">shame</span>
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false"></div>

        <div class="footer">
      4월 26일 무척 재밌을 것 같아요
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">SAVE SETLIST</button>
        <a id="spotify-btn" href="https://open.spotify.com/search" target="_blank">
            LISTEN ON SPOTIFY
        </a>
    </div>

    <script>
        const editable = document.getElementById('editable-content');
        const saveBtn = document.getElementById('save-btn');

        window.onload = () => {
            editable.focus();
        };

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            const canvas = await html2canvas(paper, { 
                scale: 3, 
                backgroundColor: "#c0c0c0", 
                logging: false 
            });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "SHAME-SETLIST.png", { type: "image/png" });
                
                if (navigator.share) {
                    try {
                        await navigator.share({ files: [file], title: 'SHAME SETLIST' });
                    } catch (err) {
                        if (err.name !== 'AbortError') downloadFallback(canvas);
                    }
                } else {
                    downloadFallback(canvas);
                }
            }, 'image/png');
        };

        function downloadFallback(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'SHAME-SETLIST.png';
            link.click();
        }
    </script>
</body>
</html>
