<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>MY OWN SHAME SETLIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #cfcfcf;
            color: #1a1a1a;
            font-family: 'Permanent Marker', cursive;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
        }

        #setlist-paper {
            width: 90%;
            max-width: 380px;
            background-color: #fff;
            padding: 50px 35px;
            box-sizing: border-box;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            /* 재생지 느낌의 미세한 노이즈 */
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }

        /* 스테이플러 심 디테일 */
        .staple {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 4px;
            background: #888;
            border-radius: 1px;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
            pointer-events: none;
        }

        .header-top {
            font-size: 14px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .artist-name {
            font-size: 56px;
            line-height: 0.9;
            margin: 10px 0;
            letter-spacing: -2px;
        }

        #editable-content {
            width: 100%;
            flex-grow: 1;
            font-size: 24px;
            line-height: 1.2;
            outline: none;
            min-height: 320px;
            white-space: pre-wrap;
            text-align: left;
            caret-color: #ff4500; /* 오렌지 레드 커서 */
            color: #222;
        }

        #editable-content:empty:before {
            content: 'ENTER TRACKS...';
            color: #ddd;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .footer {
            margin-top: 30px;
            font-size: 18px;
            text-align: center;
            opacity: 0.8;
            pointer-events: none;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .btn-container {
            width: 90%;
            max-width: 380px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button, a {
            width: 100%;
            border: 2px solid #1a1a1a;
            padding: 16px;
            font-family: sans-serif; 
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            background: #111;
            color: #fff;
            text-transform: uppercase;
        }

        #save-btn { background: #111; color: #fff; }
        #spotify-btn { background: #fff; color: #1DB954; border-color: #1DB954; }
    </style>
</head>
<body>

    <div id="setlist-paper">
        <div class="staple"></div>
        
        <div class="header">
            <div class="header-top">
                26.04.2026 / SSMD LIVE HALL
            </div>
            <div class="artist-name">
                SHAME
            </div>
        </div>
        
        <div id="editable-content" contenteditable="true" spellcheck="false"></div>

        <div class="footer">
        4월 26일 무척 재밌을 것 같아요
        </div>
    </div>

    <div class="btn-container">
        <button id="save-btn">EXPORT IMAGE</button>
        <a id="spotify-btn" href="https://open.spotify.com/search" target="_blank">
            LISTEN ON SPOTIFY
        </a>
    </div>

    <script>
        const editable = document.getElementById('editable-content');
        const saveBtn = document.getElementById('save-btn');

        window.onload = () => {
            editable.focus();
        };

        saveBtn.onclick = async () => {
            const paper = document.getElementById('setlist-paper');
            const canvas = await html2canvas(paper, { 
                scale: 3, 
                backgroundColor: "#cfcfcf", 
                logging: false 
            });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "SHAME-SETLIST-MS.png", { type: "image/png" });
                
                if (navigator.share) {
                    try {
                        await navigator.share({ 
                            files: [file], 
                            title: 'SHAME SETLIST' 
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') downloadFallback(canvas);
                    }
                } else {
                    downloadFallback(canvas);
                }
            }, 'image/png');
        };

        function downloadFallback(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'SHAME-SETLIST-MS.png';
            link.click();
        }
    </script>
</body>
</html>
