<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와주셔서 감사해요</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center; /* 세로 중앙 */
            overflow: hidden;
        }

        .container {
            width: 100%;
            padding-left: 5%; /* 왼쪽 정렬의 맛을 살리는 최소 여백 */
        }

        .content {
            font-family: "Pretendard", sans-serif;
            font-weight: 700; /* 원래 요청하신 볼드체 */
            /* 폰트 사이즈를 대폭 키움 (화면 너비의 13%) */
            font-size: 13vw; 
            line-height: 1.1; /* 줄 간격을 더 좁혀서 덩어리감 강조 */
            white-space: pre-line;
            letter-spacing: -0.06em; /* 글자가 커진 만큼 자간을 더 조여서 한 줄에 들어가게 함 */
            word-break: keep-all;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">2월 20일은
언더독 커피에서
턴스타일
NEVER ENOUGH
앨범 필름을 봤어.
실로 멋졌지..</div>
</div>

</body>
</html>
