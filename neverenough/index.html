<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>와주셔서 감사해요</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            /* 세로만 중앙 정렬, 가로는 왼쪽부터 시작 */
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            padding: 0 8%; /* 좌측 여백을 주어 시각적 안정감 확보 */
        }

        .content {
            font-family: "Pretendard", sans-serif;
            font-weight: 800;
            font-size: 9vw; /* 왼쪽 정렬 시 더 꽉 차 보이도록 살짝 키움 */
            line-height: 1.25;
            white-space: pre-line;
            letter-spacing: -0.03em; /* 볼드체 특유의 응집력을 위해 자간을 더 좁힘 */
            word-break: keep-all;
            text-align: left; /* 왼쪽 정렬 */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">2월 20일에
언더독 커피에서
TURNSTILE
NEVER ENOUGH
앨범 필름을 봤어.
실로 멋졌지..</div>
</div>

</body>
</html>
